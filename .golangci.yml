version: "2"

linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - dupl
    - revive
    - goclocbudget

  settings:
    gocyclo:
      min-complexity: 12

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    nestif:
      min-complexity: 5

    dupl:
      threshold: 100

    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]

    custom:
      goclocbudget:
        type: "module"
        description: "Enforces the implementation Go LOC budget using gocloc."
        settings:
          # This module is a seam, not an application: every provider driver
          # translates one wire format onto the same neutral contract. Growth
          # should come from new drivers, not from the core getting fatter.
          # Raise by 500 at a time, and only when no other option remains.
          max-go-code-lines: 3000
          include-tests: false
          exclude-generated: true
          exclude-dirs:
            - vendor
            - .git
            # Its own Go module, with its own dependencies and its own budget
            # question. Counting it here would charge the core for code the
            # core does not ship.
            - provider/anthropicsdk
            - provider/openaisdk
            - provider/bedrocksdk
            - router
            # Demo code, not implementation: it teaches the seam rather than
            # shipping it, so it does not spend the core's budget.
            - examples

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
          - nestif
          - dupl
          - revive
